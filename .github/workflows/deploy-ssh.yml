name: Deploy to remote server via SSH

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "Logging into GHCR on remote host"
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin || true
            echo "Pulling latest image"
            docker pull ghcr.io/${{ github.repository_owner }}/cpk-app:latest
            echo "Stopping old container (if any)"
            docker rm -f cpk-app || true
            echo "Starting new container"
            docker run -d --name cpk-app -p 8501:8501 --restart unless-stopped ghcr.io/${{ github.repository_owner }}/cpk-app:latest

    # Notes:
    # - Set the following repository secrets before using this workflow:
    #   SSH_HOST, SSH_USER, SSH_PORT (optional, default 22), SSH_KEY (private key),
    #   GHCR_USERNAME (your GitHub username), GHCR_TOKEN (a personal access token with read:packages or use GITHUB_TOKEN if permitted).
